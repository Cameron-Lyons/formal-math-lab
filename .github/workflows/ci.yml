name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: Lint tracked shell scripts with shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          mapfile -t scripts < <(git ls-files '*.sh')
          if (( ${#scripts[@]} > 0 )); then
            shellcheck --severity=warning "${scripts[@]}"
          fi

  repo-integrity:
    name: Repository and Lean static integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify manifests, toolchains, README links, and proof hygiene
        run: python3 -m scripts.ci.check_repo

  python:
    name: Python (Ruff, ty, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync locked Python 3.15 environment
        run: uv sync --locked --group dev
      - name: Lint Python with Ruff
        run: uv run --locked ruff check
      - name: Check Python formatting with Ruff
        run: uv run --locked ruff format --check
      - name: Type-check Python with ty
        run: uv run --locked ty check
      - name: Run CI helper unit tests
        run: uv run --locked python -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Run problem unit tests
        run: |
          cd erdos-677-equal-lcms/search
          uv run --locked python -m unittest test_height.py -v

  c-cpp:
    name: C23 and C++23 strict build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GCC 14 and Clang 18
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14 clang-18
      - name: Compile and link C23/C++23 sources with GCC 14
        run: python3 -m scripts.ci.check_c_cpp --cc gcc-14 --cxx g++-14 --mode link
      - name: Compile and link C23/C++23 sources with Clang 18
        run: python3 -m scripts.ci.check_c_cpp --cc clang-18 --cxx clang++-18 --mode link

  detect-lean-changes:
    name: Detect affected Lean packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute affected Lean package matrix
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          base=""
          head="HEAD"
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
            merge_group)
              base="$MG_BASE"
              head="$MG_HEAD"
              ;;
          esac
          python3 -m scripts.ci.packages matrix \
            --mode changed \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT"

  lean:
    name: Lean (${{ matrix.pkg }})
    needs: detect-lean-changes
    if: needs.detect-lean-changes.outputs.has_packages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.detect-lean-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space for heavy certificate build
        if: matrix.heavy
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost
          df -h
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
          lake-package-directory: ${{ matrix.pkg }}
      - name: Build and verify Lean package
        env:
          PKG: ${{ matrix.pkg }}
        run: python3 -m scripts.ci.packages build "$PKG" --leanchecker

  required:
    name: CI passed
    needs:
      - workflow-lint
      - repo-integrity
      - python
      - c-cpp
      - detect-lean-changes
      - lean
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          REPO_INTEGRITY: ${{ needs.repo-integrity.result }}
          PYTHON_RESULT: ${{ needs.python.result }}
          CCPP_RESULT: ${{ needs.c-cpp.result }}
          DETECT_RESULT: ${{ needs.detect-lean-changes.result }}
          HAS_PACKAGES: ${{ needs.detect-lean-changes.outputs.has_packages }}
          LEAN_RESULT: ${{ needs.lean.result }}
        run: |
          echo "workflow-lint=$WORKFLOW_LINT"
          echo "repo-integrity=$REPO_INTEGRITY"
          echo "python=$PYTHON_RESULT"
          echo "c-cpp=$CCPP_RESULT"
          echo "detect-lean-changes=$DETECT_RESULT (has_packages=$HAS_PACKAGES)"
          echo "lean=$LEAN_RESULT"
          [[ "$WORKFLOW_LINT" == success ]]
          [[ "$REPO_INTEGRITY" == success ]]
          [[ "$PYTHON_RESULT" == success ]]
          [[ "$CCPP_RESULT" == success ]]
          [[ "$DETECT_RESULT" == success ]]
          if [[ "$HAS_PACKAGES" == true ]]; then
            [[ "$LEAN_RESULT" == success ]]
          else
            [[ "$LEAN_RESULT" == skipped ]]
          fi
