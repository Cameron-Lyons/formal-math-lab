  "PoleOneDegree", "PoleOne", "PoleTwo", "PoleTwoReduction", "PoleTwoLifting", "Fibers", "MordellDescent",
  "QuadraticIntegers", "TangentArithmetic", "PolynomialGraph", "PellDegreeRatio",
  "QuarticReflection", "SexticBoundary", "WitnessSearch", "WitnessTangent",
  "MixedPellAmplification", "TwoPointDegree", "TwoPointMarkedPolynomial",
